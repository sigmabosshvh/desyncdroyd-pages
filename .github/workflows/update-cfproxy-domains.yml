name: Update CF proxy domains

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update domain list
        run: |
          curl -fsSL --retry 3 \
            https://raw.githubusercontent.com/Flowseal/tg-ws-proxy/main/.github/cfproxy-domains.txt \
            -o cfproxy-domains.txt.new

          if ! cmp -s cfproxy-domains.txt.new cfproxy-domains.txt; then
            mv cfproxy-domains.txt.new cfproxy-domains.txt

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add cfproxy-domains.txt
            git commit -m "Update CF proxy domains"
            git push
          else
            rm cfproxy-domains.txt.new
          fi
